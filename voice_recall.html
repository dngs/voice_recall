<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗文背诵校验V2（支持粘贴输入 / URL传参）</title>
<style>
*{box-sizing:border-box;}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;margin:16px;max-width:950px;margin-inline:auto;font-size:17px;}
.box{border:1px solid #ccc;padding:16px;border-radius:10px;margin:14px 0;}
button{padding:10px 16px;font-size:17px;margin:4px;cursor:pointer;border-radius:8px;border:none;background:#2b60de;color:#fff;}
button:disabled{background:#99a9cc;}
textarea{width:100%;min-height:120px;padding:10px;font-size:17px;border:1px solid #aaa;border-radius:6px;}
.correct{background:#c8efcb;padding:2px 3px;}
.error{background:#ffc8c8;padding:2px 3px;}
.info{color:#444;font-size:15px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/whisper-js@0.0.16/dist/whisper.min.js"></script>
</head>
<body>
<h2>🎙古诗文背诵校验</h2>
<div class="box">
<h4>📖粘贴或输入标准答案（外出手机离线使用）</h4>
<textarea id="stdInput" placeholder="粘贴你的古诗文参考原文；局域网访问时会自动填充URL传入的文本"></textarea>
</div>
<div class="box">
<h4>🎤录音背诵识别</h4>
<p class="info">首次打开会下载语音识别模型，建议wifi下加载；之后离线可用；朗读完毕点停止</p>
<button id="btnStart">开始录音</button>
<button id="btnStop" disabled>停止录音</button>
<div id="status">就绪</div>
</div>
<div class="box">
<h4>🔍比对结果</h4>
<div id="compareResult"></div>
</div>

<script>
function getUrlParam(name){
    const params=new URLSearchParams(window.location.search);
    return params.get(name)||"";
}
const refFromUrl=getUrlParam("text");
const stdInput=document.getElementById("stdInput");
if(refFromUrl){
    stdInput.value=refFromUrl;
}

let mediaRecorder;
let audioChunks=[];
const btnStart=document.getElementById("btnStart");
const btnStop=document.getElementById("btnStop");
const statusDom=document.getElementById("status");
const resultDom=document.getElementById("compareResult");

async function initModel(){
    statusDom.innerText="正在加载语音识别模型，请稍候…";
    const model=await Whisper.create("tiny-zh");
    statusDom.innerText="模型就绪！填写参考文本后就可以录音背诵";
    return model;
}
let whisperModelPromise=initModel();

btnStart.onclick=async ()=>{
    if(!stdInput.value.trim()){
        alert("请先粘贴填入标准答案！");
        return;
    }
    audioChunks=[];
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.start();
    btnStart.disabled=true;
    btnStop.disabled=false;
    statusDom.innerText="🎙正在录音，请朗读古诗文……";
};

btnStop.onclick=async ()=>{
    btnStop.disabled=true;
    statusDom.innerText="停止录音，开始识别转写……";
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    const blob=await new Promise(resolve=>{
        mediaRecorder.onstop=()=>{
            resolve(new Blob(audioChunks,{type:'audio/webm'}));
        }
    });
    const model=await whisperModelPromise;
    const {result}=await model.transcribe(blob);
    const userText=result.text.trim();
    statusDom.innerText="识别完成";
    diffRender(stdInput.value.trim(),userText);
};

function diffRender(standard,user){
    resultDom.innerHTML="";
    const divUser=document.createElement("div");
    divUser.innerHTML="<p><b>识别‑你的背诵：</b></p>";
    const divStd=document.createElement("div");
    divStd.innerHTML="<p><b>参考原文：</b></p>";
    let htmlUser="";
    let htmlStd="";
    const maxLen=Math.max(standard.length,user.length);
    for(let i=0;i<maxLen;i++){
        const sChar=standard[i]||" ";
        const uChar=user[i]||" ";
        if(sChar===uChar){
            htmlUser+=`<span class="correct">${uChar}</span>`;
            htmlStd+=`<span class="correct">${sChar}</span>`;
        }else{
            htmlUser+=`<span class="error">${uChar}</span>`;
            htmlStd+=`<span class="error">${sChar}</span>`;
        }
    }
    divUser.innerHTML += `<div>${htmlUser}</div>`;
    divStd.innerHTML += `<div>${htmlStd}</div>`;
    resultDom.appendChild(divUser);
    resultDom.appendChild(divStd);
}
</script>
</body>
</html>
